name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.8.23"
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --locked

      - name: ruff
        run: uv run --locked ruff check src tests

      - name: ruff format
        run: uv run --locked ruff format --check src tests

      - name: mypy
        run: uv run --locked mypy

      - name: pytest
        run: uv run --locked pytest

      - name: Agent definitions
        run: python3 scripts/check_agents.py
