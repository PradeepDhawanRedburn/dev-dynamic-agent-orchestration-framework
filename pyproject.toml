[project]
name = "orchestrator"
version = "0.0.0"
description = "Dynamic agent orchestration framework"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic==2.14.4",
    "langgraph==1.2.24",
    "langchain==1.5.2",
    "langchain-azure-ai==1.2.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "pip-licenses==5.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
mypy_path = "src"
