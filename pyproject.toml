[project]
name = "orchestrator"
version = "0.0.0"
description = "Dynamic agent orchestration framework"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic==2.14.4",
    "langgraph==1.2.24",
    "langchain==1.5.2",
    "langchain-azure-ai==1.2.3",
    "langgraph-checkpoint-postgres==3.2.1",
    "psycopg[binary]==3.3.9",
    "pycryptodome==4.5.0",
    "opentelemetry-api==1.45.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "pip-licenses==5.5.5",
    "langchain-azure-ai[opentelemetry]==1.2.3",
    "opentelemetry-sdk==1.45.2",
    "hypothesis==6.170.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "foundry: needs a Microsoft Foundry deployment; skipped, visibly, when it is not configured",
    "postgres: needs PostgreSQL; uses a local container or SPIKE_POSTGRES_DSN",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
mypy_path = "src"

# The WP-01 spike tests probe library behaviour with deliberately loose types and drive
# untyped reference code. They are not production code; src/ and tests/unit stay strict.
[[tool.mypy.overrides]]
module = ["tests.spike.*"]
ignore_errors = true

# Copied from reference/ with the 52 tests. They pass deliberately invalid values to prove that
# validation rejects them, so strict typing would mean rewriting them. New tests stay strict.
[[tool.mypy.overrides]]
module = [
    "tests.unit.test_core",
    "tests.unit.test_assurance",
    "tests.unit.test_recruiter",
    "tests.unit.test_skills",
]
ignore_errors = true
